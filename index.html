html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	width: 100vw;
	height: 100dvh;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

@font-face {
    font-family: Tsap;
    src: url("branding/Tsap-Tsarap.ttf") format("truetype");
    font-display: swap;
}

#status {
    position: fixed;
    inset: 0;
    z-index: 10;
    box-sizing: border-box;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: #101521;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: clamp(16px, 3.5vmin, 28px);
}

#loading-title {
    margin: 0;
    color: #e3b552;
    font: 400 clamp(24px, 7vmin, 56px)/1.15 Tsap, sans-serif;
    letter-spacing: .03em;
    text-align: center;
}

.loading-art {
    /* The previous splash filled the viewport's shorter side; this is half. */
    width: 50vmin;
    height: 50vmin;
    flex: 0 0 auto;
}

#loading-tower {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}

#loading-crystal {
    transform-box: fill-box;
    transform-origin: center;
    animation: crystal-pulse 1.8s ease-in-out infinite;
}

#loading-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: energy-pulse 1.8s ease-in-out infinite;
}

@keyframes crystal-pulse {
    0%, 100% { transform: scale(.97); filter: brightness(1) drop-shadow(0 0 3px #23a8c8); }
    50% { transform: scale(1.08); filter: brightness(1.25) drop-shadow(0 0 13px #38dafa); }
}

@keyframes energy-pulse {
    0%, 100% { transform: scale(.85); opacity: .35; }
    50% { transform: scale(1.15); opacity: .8; }
}

#status-progress {
    width: min(50vmin, 360px);
    height: 6px;
    flex: 0 0 auto;
    border: 0;
    border-radius: 6px;
    overflow: hidden;
    accent-color: #43d6ed;
    background: #28344a;
}

#status-progress::-webkit-progress-bar { background: #28344a; border-radius: 6px; }
#status-progress::-webkit-progress-value { background: #43d6ed; border-radius: 6px; }
#status-progress::-moz-progress-bar { background: #43d6ed; border-radius: 6px; }
#status-notice { display: none; }
#status[data-mode="notice"] #status-progress { display: none; }
#status[data-mode="notice"] #loading-crystal,
#status[data-mode="notice"] #loading-glow { animation-play-state: paused; }

@media (prefers-reduced-motion: reduce) {
    #loading-crystal, #loading-glow { animation: none; }
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7983676,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

// Keep CSS layout/input coordinates, but avoid rendering at unrestricted device DPR.
(function () {
    const canvas = document.getElementById('canvas');
    function resizeRenderBuffer() {
        const width = Math.max(1, canvas.clientWidth);
        const height = Math.max(1, canvas.clientHeight);
        const scale = Math.min(window.devicePixelRatio || 1, 1.5,
            720 / Math.min(width, height), 1280 / Math.max(width, height));
        const renderWidth = Math.max(1, Math.floor(width * scale));
        const renderHeight = Math.max(1, Math.floor(height * scale));
        if (canvas.width !== renderWidth) canvas.width = renderWidth;
        if (canvas.height !== renderHeight) canvas.height = renderHeight;
    }
    resizeRenderBuffer();
    window.addEventListener('resize', resizeRenderBuffer);
    window.addEventListener('pageshow', resizeRenderBuffer);
}());

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.dataset.mode = mode;
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
