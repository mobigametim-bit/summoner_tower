<!doctype html>
<html lang="ru">

<title>Summoner Tower — карточка ссылки</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#101521}

.scene{position:absolute;left:580px;top:20px;width:620px;height:590px}
